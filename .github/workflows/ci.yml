name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Builds the app with E2E=1 (Clerk/Supabase swapped for in-memory stand-ins,
      # AI pointed at a local fake server) and runs the end-to-end suite.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
